<div class="w-full animate-fade-in mx-auto bg-gray-50 min-h-screen">

    <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 mb-3">

        <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_auto_minmax(0,1fr)] items-center gap-3">

            <!-- LEFT -->
            <div class="flex items-center gap-2 min-w-0">
                <div class="h-10 w-10 rounded-lg bg-[var(--text-active)]
                   flex items-center justify-center text-white shadow-sm shrink-0">
                    <i class="ri-ticket-line"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">
                        Tickets
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500">
                        View and manage all Tickets.
                    </p>
                </div>
            </div>

            <!-- CENTER -->
            <div class="flex justify-center w-full">
                <app-date-range-filter class="w-full max-w-[320px]" [initialStartDate]="initialStartDate"
                    [initialEndDate]="initialEndDate" (rangeChange)="onRangeChange($event)">
                </app-date-range-filter>
            </div>

            <!-- RIGHT -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-end gap-3 w-full sm:w-auto min-w-0">

                <div class="relative w-full sm:w-60">
                    <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                        <i class="ri-search-line text-gray-400 text-xs"></i>
                    </span>

                    <input type="text" [value]="searchTerm" (input)="onSearch($event)" placeholder="Search..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm
            focus:outline-none focus:border-2
            focus:border-[var(--text-active)]
            placeholder-gray-400 transition-colors" />
                </div>

                <!-- ACTION BUTTONS WRAPPER -->
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">

                    <button *ngIf="!isRaisedTickets" (click)="generateTicketsPdf()" [disabled]="!canDownloadPdf"
                        class="w-full sm:w-auto pdf-enabled inline-flex items-center justify-center px-4 py-2 text-sm font-semibold rounded-lg">
                        <i class="ri-file-pdf-2-fill !text-2xl"></i>
                    </button>

                    <button *ngIf="isRaisedTickets"
                        class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-1 text-sm font-medium rounded-lg shadow-sm text-white bg-[var(--text-active)] whitespace-nowrap"
                        (click)="openTicket('ticket')">
                        <i class="ri-add-line mr-2 text-lg"></i>
                        Self Ticket
                    </button>

                    <button *ngIf=" isRaisedTickets"
                        class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-1 text-sm font-medium rounded-lg shadow-sm text-white bg-[var(--text-active)] whitespace-nowrap"
                        (click)="openTicket('assignticket')">
                        <i class="ri-add-line mr-2 text-lg"></i>
                        Assign Ticket
                    </button>

                </div>

            </div>

        </div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <div #tableDiv></div>
    </div>

</div>
