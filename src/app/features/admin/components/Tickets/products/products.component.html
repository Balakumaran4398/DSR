<div class="w-full animate-fade-in  mx-auto bg-gray-50 min-h-screen ">
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-8">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between flex-wrap">
            <div class="flex items-center gap-3 shrink-0">
                <div class="h-10 w-10 rounded-lg bg-[var(--text-active)]
                   flex items-center justify-center text-white shadow-sm shrink-0">
                    <i class="ri-price-tag-3-line dsr-nav-nav-icon"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold text-slate-900 leading-tight">
                        Products
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500">
                        View and manage all products.
                    </p>
                </div>
            </div>

            <div class="flex flex-col gap-3 w-full
             sm:flex-row sm:items-center sm:w-auto">

                <div class="relative w-full sm:w-64">
                    <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                        <i class="ri-search-line text-gray-400 text-sm"></i>
                    </span>

                    <input type="text" [value]="searchTerm" (input)="onSearch($event)" placeholder="Search..." class="w-full pl-10 pr-4 py-2
                 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:border-2
                 focus:border-[var(--text-active)]
                 placeholder-gray-400 transition-colors" />
                </div>

                <button *ngIf="!role.includes('ROLE_EMPLOYEE')" class="inline-flex items-center justify-center
               w-full sm:w-auto
               px-4 py-1 text-sm font-medium
               rounded-lg shadow-sm text-white
               bg-[var(--text-active)]
               hover:opacity-90
               active:scale-95
               transition-all" (click)="openProduct('products')">

                    <i class="ri-add-line mr-2 text-lg"></i>
                    Add Product
                </button>
            </div>

        </div>
    </div>
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
        <div #tableDiv></div>
    </div>
</div>
