<div class="w-full animate-fade-in  mx-auto bg-gray-50 min-h-screen ">
    <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-lg bg-[var(--text-active)]
           flex items-center justify-center text-white shadow-sm shrink-0">
            <i class="ri-node-tree text-xl"></i>
        </div>

        <div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-900">
                Not Send DSR
            </h1>
            <p class="text-xs sm:text-sm text-slate-500">
                Manage your organization
            </p>
        </div>
    </div>
    <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-200 mb-8">
        
        <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between flex-wrap">
            <!-- 3. Actions Section (Search & Add) -->
            <div  class="flex flex-col align-center gap-3 w-full sm:flex-row sm:items-center sm:w-auto shrink-0">
                <form class="example-form w-full sm:w-72" *ngIf="canSelectEmployee">
                    <mat-form-field class="w-full" appearance="outline" subscriptSizing="dynamic">
                        <mat-select placeholder="Select Employee" [formControl]="myControl"
                            [compareWith]="compareEmployeeById" panelClass="overview-release-select-panel"
                            (selectionChange)="onEmployeeSelect($event.value)"
                            (openedChange)="onEmployeeSelectOpened($event)">
                            <mat-select-trigger>{{ selectedEmployeeLabel }}</mat-select-trigger>
                            <div class="sticky top-0 bg-white z-10 px-3 py-2 border-b border-slate-100"
                                (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
                                <div class="relative">
                                    <mat-icon
                                        class="absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-sm !w-4 !h-4"
                                        style="font-size: 16px;">search</mat-icon>
                                    <input type="text" [formControl]="employeeFilterControl"
                                        class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                                        placeholder="Search Employee" aria-label="Search employees">
                                </div>
                            </div>
                            <mat-option [value]="allEmployeesValue">All Employees</mat-option>
                            <ng-container *ngIf="filteredEmployeeOptions | async as employeeOptions">
                                <mat-option *ngFor="let employee of employeeOptions" [value]="employee">
                                    {{ employee.employee_name }}
                                </mat-option>
                                <mat-option *ngIf="!employeeOptions.length" disabled>
                                    No employees found
                                </mat-option>
                            </ng-container>
                        </mat-select>
                        <button *ngIf="hasEmployeeSelection" mat-icon-button matSuffix type="button" aria-label="Clear employee selection"
                            (click)="$event.stopPropagation(); clearSelection()">
                            <mat-icon>close</mat-icon>
                        </button>
                    </mat-form-field>
                </form>
            </div>
            <div class="flex items-center justify-center w-full lg:w-auto my-1 lg:my-0">
                <app-date-range-filter [initialStartDate]="startDate" [initialEndDate]="endDate"
                    (rangeChange)="onRangeChange($event)"></app-date-range-filter>
            </div>
            <div class="flex flex-col gap-3 w-full
            sm:flex-row sm:items-center sm:w-auto">
                <div class="flex flex-col gap-3 w-full sm:flex-row sm:items-center sm:w-auto" role="tablist">
                    <!-- <button *ngFor="let tab of mainTabs" (click)="setActiveTab(tab.id)"
                        [attr.aria-selected]="currentView === tab.id"
                        class="inline-flex items-center justify-center w-full sm:w-auto px-6 py-2 text-lg font-semibold rounded-lg shadow-sm "
                        [class]="currentView === tab.id 
            ? 'bg-[var(--text-active)] text-white ring-2 ring-blue-100' 
            : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'">
                        <ng-container *ngIf="tab.id === 'kanban'; else timeIcon">
                            <i class="ri-trello-line text-2xl"></i>
                        </ng-container>
                        <ng-template #timeIcon>
                            <i class="ri-table-line text-2xl"></i>
                        </ng-template>
                        {{ tab.label }}
                    </button> -->
                </div>
            </div>
        </div>
    </div>
    <!-- Table Card -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden app-loading-host">
        <!-- The Grid -->
        <div *ngIf="currentView === 'table'"
            class="h-full bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
            <div class="overflow-auto flex-1">
                <div #tableDiv></div>
                <div *ngIf="!notSentDsrLoading && tableData.length === 0"
                    class="px-4 py-10 text-center text-sm text-slate-500">
                    No not-sent records match the selected employee and date range.
                </div>
            </div>
        </div>
        <div *ngIf="currentView === 'kanban'"
            class="h-full bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden flex flex-col">
            <div class="h-full ">
                <app-overview-task-gantt [rawData]="tableData"></app-overview-task-gantt>
            </div>
        </div>


        <div *ngIf="notSentDsrLoading" class="app-local-loading-overlay">
            <div class="app-local-loading">
                <i class="ri-loader-4-line app-spin"></i>
                <span>Loading not sent DSR...</span>
            </div>
        </div>
    </div>

</div>
