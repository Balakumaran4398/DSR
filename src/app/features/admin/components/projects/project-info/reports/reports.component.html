<header
    class="flex items-center justify-between h-[64px] px-6 bg-white border-b border-slate-200 shrink-0 z-30 shadow-sm">
    <div class="flex items-center gap-3">
        <div class="flex items-center justify-center w-10 h-10 text-white bg-[var(--text-active)] rounded-xl shadow-lg">
            <i class="ri-focus-3-line text-xl"></i>
        </div>
        <div>
            <h1 class="text-lg font-black tracking-tight text-[var(--text-active)] uppercase leading-none">Mission
                Reports</h1>
            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Project ID: {{ projectid }}
            </p>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <div class="flex bg-slate-100 p-1 rounded-lg gap-1">
            <button *ngFor="let mode of ['Day', 'Week', 'Month']" (click)="changeViewMode(mode)"
                [class.bg-white]="currentViewMode === mode" [class.text-active]="currentViewMode === mode"
                [class.shadow-sm]="currentViewMode === mode"
                class="px-4 py-1.5 text-xs font-black rounded-md transition-all text-slate-500 hover:text-[var(--text-active)] uppercase tracking-tight">
                {{ mode }}
            </button>
        </div>
        <!-- <button (click)="addNewTask()" class="flex items-center gap-2 px-5 py-2 text-xs font-black text-white bg-[var(--text-active)] rounded-md hover:bg-[var(--text-active)] transition-all shadow-md active:scale-95 tracking-wider">
        <i class="ri-add-line"></i>
        NEW MISSION
      </button> -->
    </div>
</header>
<!-- Main Workspace -->
<main class="gantt-main-content">

    <!-- Sidebar: Employees -->
    <aside class="gantt-sidebar">
        <!-- <div class="gantt-sidebar-header">
           
        </div> -->
        <div class="gantt-employee-list">
            <div *ngFor="let emp of employees" class="gantt-employee-item"
                [class.gantt-active]="currentFilter === emp.id" (click)="filterByEmployee(emp.id)">
                <div class="gantt-avatar">{{ emp.avatar }}</div>
                <div class="gantt-employee-info">
                    <span class="gantt-employee-name">{{ emp.name }}</span>
                    <span class="gantt-employee-role">{{ emp.role }}</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- Chart -->
    <div class="gantt-chart-card">
        <!-- Empty State -->
        <div class="gantt-empty-state" [class.gantt-visible]="filteredTasks.length === 0">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
                stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z">
                </path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <p style="margin-top: 1rem; font-weight: 500;">No active directives</p>
        </div>

        <!-- Gantt Container -->
        <div class="gantt-wrapper">
            <svg #ganttSvg id="gantt"></svg>
        </div>
    </div>
</main>
