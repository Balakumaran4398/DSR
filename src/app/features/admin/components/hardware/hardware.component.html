<div class="w-full animate-fade-in mx-auto bg-gray-50 min-h-screen">
  <div class="flex flex-col gap-4 mb-4 sm:flex-row sm:items-center sm:justify-between">
    <!-- Title Section -->
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-lg bg-[var(--text-active)] flex items-center justify-center text-white shadow-sm shrink-0">
        <i class="ri-server-line text-xl"></i>
      </div>
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-slate-900">Server Details</h1>
        <p class="text-xs sm:text-sm text-slate-500">Compute, memory, storage and network configuration</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="no-print flex flex-col gap-2 w-full sm:flex-row sm:items-center sm:w-auto">
      <button
        type="button"
        (click)="exportJson()"
        class="inline-flex items-center justify-center w-full sm:w-auto px-4 py-1 text-sm font-medium rounded-lg shadow-sm text-white bg-[var(--text-active)] hover:opacity-90 active:scale-95 transition-all">
        <i class="ri-download-2-line mr-2 text-lg"></i>
        Export
      </button>

      
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Overview -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 lg:col-span-2 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">Overview</h3>
        <span class="text-xs text-slate-500">Server identity</span>
      </div>

      <div class="p-6">
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-5">
          <div *ngFor="let item of overviewItems; trackBy: trackByLabel">
            <dt class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i *ngIf="item.icon" [class]="item.icon + ' text-slate-400'"></i>
              <span>{{ item.label }}</span>
            </dt>
            <dd class="mt-1 flex items-center gap-2">
              <span class="text-sm font-medium text-slate-900" [class.font-mono]="item.mono">{{ item.value || '—' }}</span>

              <button
                *ngIf="item.copy && item.value"
                type="button"
                class="no-print inline-flex items-center gap-1 rounded-md border border-gray-200 bg-white px-2 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition"
                (click)="copy(item.value, item.label)">
                <i class="ri-file-copy-line"></i>
                Copy
              </button>

              <span *ngIf="copiedKey === item.label" class="no-print text-xs font-semibold text-emerald-600">Copied</span>
            </dd>
          </div>
        </dl>
      </div>
    </div>

    <!-- Quick Specs -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-800">Quick Specs</h3>
        <span class="text-xs text-slate-500">At a glance</span>
      </div>

      <div class="p-6 space-y-3">
        <div
          *ngFor="let card of quickCards; trackBy: trackByLabel"
          class="flex items-start justify-between gap-3 rounded-lg border border-gray-200 p-3 hover:border-blue-300 transition-colors">
          <div class="flex items-start gap-3 min-w-0">
            <div class="h-9 w-9 rounded-lg border border-gray-200 flex items-center justify-center shrink-0" [ngClass]="card.iconBgClass">
              <i [class]="card.icon + ' text-lg ' + card.iconTextClass"></i>
            </div>
            <div class="min-w-0">
              <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">{{ card.label }}</div>
              <div class="text-sm font-semibold text-slate-900 truncate">{{ card.value || '—' }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed Sections -->
  <div class="mt-4 grid grid-cols-1 xl:grid-cols-2 gap-4">
    <div *ngFor="let section of sections" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden print-card">
      <div class="px-6 py-4 border-b border-slate-200">
        <h3 class="text-sm font-bold text-slate-800">{{ section.title }}</h3>
        <p *ngIf="section.description" class="text-xs text-slate-500 mt-1">{{ section.description }}</p>
      </div>

      <div class="p-6">
        <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-5">
          <div *ngFor="let item of section.items; trackBy: trackByLabel">
            <dt class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
              <i *ngIf="item.icon" [class]="item.icon + ' text-slate-400'"></i>
              <span>{{ item.label }}</span>
            </dt>
            <dd class="mt-1 text-sm font-medium text-slate-900" [class.font-mono]="item.mono">{{ item.value || '—' }}</dd>
          </div>
        </dl>
      </div>
    </div>
  </div>
</div>
