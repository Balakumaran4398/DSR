<div class="overall-details-dialog">
  <div class="overall-details-dialog__header">
    <div class="overall-details-dialog__title">
      <span>
        <i [class]="data.icon || 'ri-table-line'"></i>
      </span>
      <div>
        <h3>{{ data.title || 'Details' }}</h3>
        <p>{{ rows.length || 0 }} Records</p>
      </div>
    </div>

    <button type="button" class="overall-details-dialog__close" title="Close" (click)="matDialog.closeAll()">
      <i class="ri-close-line"></i>
    </button>
  </div>

  <div class="overall-details-dialog__body">
    <div
      class="overall-details-table-wrap"
      [class.overall-details-table-wrap--scrolling]="scrollbarVisible"
      [class.app-table-scroll--ten-row-viewport]="pageSize > tableVisibleRowCount"
      
      (scroll)="showTableScrollbar()">
      <table class="overall-details-table" [class.overall-details-table--centered]="data.centerContent">
        <thead>
          <tr>
            <th *ngFor="let column of columns; trackBy: trackByColumn">
              <button
                type="button"
                class="overall-details-sort-button"
                [title]="'Sort by ' + column.label"
                (click)="sortByColumn(column)">
                <span>{{ column.label }}</span>
                <i [class]="getSortIcon(column)"></i>
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of pagedRows; trackBy: trackByRow">
            <td
              *ngFor="let column of columns; trackBy: trackByColumn"
              [class.overall-details-table__status-cell]="column.type === 'status'">
              <span
                *ngIf="column.type === 'status'; else plainCell"
                class="app-status-pill overall-details-status"
                [ngClass]="getStatusClass(row, column)"
                [class.overall-details-status--inactive]="!isActiveStatus(row, column)">
                <span class="app-status-pill__dot"></span>
                <span class="app-status-pill__label">{{ getCellValue(row, column) }}</span>
              </span>
              <ng-template #plainCell>{{ getCellValue(row, column) }}</ng-template>
            </td>
          </tr>
          <tr *ngIf="!rows.length">
            <td [attr.colspan]="columns.length || 1" class="overall-details-empty">
              No records found.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="overall-details-footer">
      <span>
        Showing {{ showingFrom }}-{{ showingTo }} of {{ rows.length }} records
      </span>
      <div class="overall-details-pagination" aria-label="Details pagination">
        <label class="overall-details-page-size-control">
          <span>Page Size</span>
          <select [value]="pageSize" (change)="onPageSizeChange($event)" aria-label="Page size">
            <option *ngFor="let option of pageSizeOptions; trackBy: trackByNumber" [value]="option">{{ option }}</option>
          </select>
        </label>
        <button type="button" [disabled]="pageIndex === 0" (click)="goToPage(0)">First</button>
        <button
          type="button"
          title="Show the previous five pages"
          aria-label="Show the previous five pages"
          [disabled]="!pageNumbers.length || pageNumbers[0] === 1"
          (click)="goToPreviousPageGroup()">
          Prev
        </button>
        <span class="app-pagination-pages">
          <button
            *ngFor="let page of pageNumbers; trackBy: trackByNumber"
            type="button"
            [class.overall-details-pagination__page--active]="pageIndex === page - 1"
            (click)="goToPage(page - 1)">
            {{ page }}
          </button>
        </span>
        <button
          type="button"
          title="Show the next five pages"
          aria-label="Show the next five pages"
          [disabled]="!pageNumbers.length || pageNumbers[pageNumbers.length - 1] >= totalPages"
          (click)="goToNextPageGroup()">
          Next
        </button>
        <button type="button" [disabled]="pageIndex >= totalPages - 1" (click)="goToPage(totalPages - 1)">Last</button>
      </div>
    </div>
  </div>
</div>
