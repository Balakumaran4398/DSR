<div class="w-full animate-fade-in  mx-auto bg-gray-50 min-h-screen ">
    <div class="flex flex-col gap-4 mb-4
           sm:flex-row sm:items-center sm:justify-between">
        <!-- Title Section -->
        <div class="flex items-center gap-3 flex-wrap">
            <button *ngIf="showOverallBackButton" type="button" class="inline-flex h-9 items-center justify-center gap-2
               rounded-lg border border-gray-200 bg-white px-3 text-sm font-semibold
               text-slate-700 shadow-sm transition
               hover:border-[var(--text-active)] hover:text-[var(--text-active)]"
               (click)="backToOverall()">
                <i class="ri-arrow-left-line text-base"></i>
                <span>Back</span>
            </button>
            <div class="h-10 w-10 rounded-lg bg-[var(--text-active)]
               flex items-center justify-center text-white shadow-sm shrink-0">
                <i class="ri-team-line text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-slate-900">
                    Team Members
                </h1>
                <p class="text-xs sm:text-sm text-slate-500">
                    Manage your organization
                </p>
            </div>
        </div>

        <!-- Actions Section -->
        <div class="flex flex-col gap-3 w-full
             sm:flex-row sm:items-center sm:w-auto">

            <!-- Search -->
            <div class="relative w-full sm:w-64">
                <span class="absolute inset-y-0 left-3 flex items-center pointer-events-none">
                    <i class="ri-search-line text-gray-400 text-sm"></i>
                </span>
                <input type="text" (input)="onSearch($event)" placeholder="Search..." class="w-full pl-10 pr-4 py-2
                 border border-gray-300 rounded-lg text-sm
                 focus:outline-none focus:border-2
                 focus:border-[var(--text-active)]
                 placeholder-gray-400 transition-colors" />
            </div>

            <!-- Add Member Button -->
            <button *ngIf="canSelectEmployee" class="inline-flex items-center justify-center
               w-full sm:w-auto
               px-4 py-1 text-sm font-medium
               rounded-lg shadow-sm text-white
               bg-[var(--text-active)]
               hover:opacity-90
               active:scale-95
               transition-all" (click)="addMenber()">
                <i class="ri-add-line mr-2 text-lg"></i>
                Add Member
            </button>
        </div>
    </div>

    <!-- Table Card -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden app-loading-host">
        <!-- The Grid -->
        <div #tableDiv></div>
        <div *ngIf="teamTableLoading" class="app-local-loading-overlay">
            <div class="app-local-loading">
                <i class="ri-loader-4-line app-spin"></i>
                <span>Loading team...</span>
            </div>
        </div>
    </div>
</div>

<div class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-white text-slate-900 px-2 py-2 rounded-full shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-50 flex items-center gap-4 min-w-[380px] border border-slate-200 transition-all duration-300 ease-out"
[class.translate-y-[150%]]="!showBar" [class.opacity-0]="!showBar" [class.translate-y-0]="showBar"
[class.opacity-100]="showBar">

<!-- Counter Pill -->
<div class="bg-[var(--text-active)] text-white rounded-full px-4 py-2 flex items-center gap-2 ml-1">
    <span class="font-bold text-white-400">{{ selectedCount }}</span>
    <span class="text-xs font-medium  text-white-400 uppercase tracking-wider">Selected</span>
</div>

<!-- Actions Toolbar -->
<div class="flex items-center gap-1 relative">

    <!-- MOVE DROPDOWN -->
    <div class="relative">
        <button (click)="toggleMoveMenu($event)"
            class="w-10 h-10 flex items-center justify-center rounded-full text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition tooltip"
            title="Move to..." [class.bg-blue-50]="showMoveMenu" [class.text-blue-600]="showMoveMenu">
            <i class="ri-folder-transfer-line text-lg"></i>
        </button>

        <!-- Menu -->
        <div *ngIf="showMoveMenu"
            class="absolute bottom-full mb-3 left-1/2 -translate-x-1/2 w-48 bg-white rounded-lg shadow-xl border border-slate-200 overflow-hidden flex flex-col animate-fadeIn">
            <div
                class="px-4 py-2 bg-slate-50 border-b border-slate-100 text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                Move to Department
            </div>
            <button (click)="moveTo('Engineering')"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition flex items-center gap-2">
                <i class="ri-code-line opacity-70"></i> Engineering
            </button>
            <button (click)="moveTo('Marketing')"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition flex items-center gap-2">
                <i class="ri-advertisement-line opacity-70"></i> Marketing
            </button>
            <button (click)="moveTo('Sales')"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition flex items-center gap-2">
                <i class="ri-line-chart-line opacity-70"></i> Sales
            </button>
        </div>
    </div>

    <!-- Divider -->
    <div class="w-px h-6 bg-slate-200 mx-2"></div>

    <!-- Delete -->
    <button (click)="onDelete()"
        class="w-10 h-10 flex items-center justify-center rounded-full text-slate-400 hover:text-red-600 hover:bg-red-50 transition tooltip"
        title="Delete Rows">
        <i class="ri-delete-bin-line text-lg"></i>
    </button>
</div>

<!-- Cancel Button -->
<button (click)="cancelSelection()"
    class="ml-auto mr-2 px-4 py-2 rounded-full text-sm font-semibold text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition">
    Cancel
</button>
</div>
