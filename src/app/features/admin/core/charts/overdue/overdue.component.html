<div class="overdue-inline-table rounded-lg border border-slate-200 bg-white" *ngIf="!data?.data">
    <div #tableOverDue></div>
</div>

<div class="overdue-dialog w-full bg-slate-50" *ngIf="data?.data">
    <div class="flex items-start justify-between gap-4 bg-[var(--text-active)] px-5 py-4 text-white">
        <div class="flex min-w-0 items-center gap-3">
            <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-white/15 text-white">
                <i [class]="data?.icon || icon"></i>
            </div>
            <div class="min-w-0">
                <h3 class="truncate text-base font-bold text-white">
                    {{ data?.title }}
                </h3>
                <div class="mt-1 flex items-center gap-2">
                    <span class="rounded-full bg-white/15 px-2.5 py-1 text-xs font-semibold text-white">
                        {{ dues.length || 0 }} Records
                    </span>
                </div>
            </div>
        </div>

        <button type="button"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg border border-white/20 bg-white/10 text-white shadow-sm transition hover:bg-white/20"
            (click)="matDialog.closeAll()" title="Close">
            <i class="ri-close-line text-xl"></i>
        </button>
    </div>

    <div class="overdue-dialog-body p-2 sm:p-4">
        <div class="overdue-dialog-table rounded-lg border border-slate-200 bg-white shadow-sm">
            <div #tableOverDue></div>
        </div>
    </div>
</div>
